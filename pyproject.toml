# Weather Station Monorepo
#
# This is the root pyproject.toml for the monorepo.
# Each package (client and server) has its own pyproject.toml with specific dependencies.
#
# To work with individual packages:
# - Client (Pi Zero): cd client && poetry install
# - Server (Pi 5):    cd server && poetry install
#
# This root file is kept for compatibility but is not required for development.

[tool.poetry]
name = "weather-station-monorepo"
version = "0.1.0"
description = "Weather Station Monorepo - Client and Server packages"
authors = ["Jordan McVeigh <jordan.mcveigh@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
