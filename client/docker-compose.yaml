version: '3.8'

services:
  weather-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-client
    restart: unless-stopped
    environment:
      - SERVER_URL=${SERVER_URL:-http://pi5:8080}
      - API_KEY=${API_KEY:-your-api-key-here}
      - STATION_ID=${STATION_ID:-piw}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-300}
      - SENSOR_READ_INTERVAL=${SENSOR_READ_INTERVAL:-15.0}
      - TEMPERATURE_OFFSET=${TEMPERATURE_OFFSET:--6.0}
      - DATABASE_PATH=/data/weather.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - weather-data:/data
    devices:
      # WeatherHAT I2C and SPI devices
      - /dev/i2c-1:/dev/i2c-1
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/gpiomem:/dev/gpiomem
    privileged: false
    cap_add:
      - SYS_RAWIO  # For I2C/SPI access
    network_mode: host  # Easier network access for Pi Zero

volumes:
  weather-data:
