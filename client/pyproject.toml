[project]
name = "weather-client"
version = "0.1.0"
description = "Weather Station Client - Lightweight data collector for Pi Zero"
authors = [{name = "Jordan McVeigh", email = "jordan.mcveigh@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "weatherhat>=1.0.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
]

[project.scripts]
weather-client = "weather_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_client"]
