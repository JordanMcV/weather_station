[project]
name = "weather-server"
version = "0.1.0"
description = "Weather Station Server - Data ingestion API and analytics for Pi 5"
authors = [{name = "Jordan McVeigh", email = "jordan.mcveigh@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "influxdb-client>=1.45.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
weather-server = "weather_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_server"]
